name: Guix reproducible build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guix:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64-linux-gnu, x86_64-w64-mingw32]
        attempt: [1, 2]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Guix
        run: |
          sudo apt-get update
          sudo apt-get install -y guix
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          guix --version | head -1
          systemctl is-active guix-daemon || sudo systemctl start guix-daemon
      - name: Guix build
        env:
          HOSTS: ${{ matrix.host }}
          JOBS: 4
        run: ./contrib/guix/guix-build
      - name: Hashes
        if: always()
        run: |
          find guix-build-*/output -type f 2>/dev/null | sort | xargs -r sha256sum | tee SHA256SUMS.part
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guix-${{ matrix.host }}-${{ matrix.attempt }}
          path: |
            SHA256SUMS.part
            guix-build-*/output/${{ matrix.host }}/*
          if-no-files-found: warn
