name: Debug Windows wallet upgrade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-dumps:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
          repository: escapeneo/bitcoinoil
          run-id: 41448768863
          github-token: ${{ github.token }}
      - name: Isolate crashing unit test
        continue-on-error: true
        shell: pwsh
        run: |
          python contrib/auxpow/fetch_test_assets.py "$env:RUNNER_TEMP/assets"
          $env:DIR_UNIT_TEST_DATA = "$env:RUNNER_TEMP/assets"
          New-Item -ItemType Directory -Force C:/unitlogs | Out-Null
          foreach ($i in 1..4) {
            & ./windows-bin/test_bitcoinoil.exe --log_level=test_suite --log_sink=C:/unitlogs/run$i.log --report_level=no
            $code = $LASTEXITCODE
            "full run $i exit=$code"
            if ($code -ne 0) { "--- last lines of run $i"; Get-Content C:/unitlogs/run$i.log -Tail 6 }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dumps-${{ matrix.attempt }}
          path: C:/unitlogs
