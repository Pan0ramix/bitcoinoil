name: Debug Windows wallet upgrade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-repeat:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: btco/windows-crash-fixes
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
          repository: Pan0ramix/bitcoinoil
          run-id: 41543121575
          github-token: ${{ github.token }}
      - name: Repeat previously crashing tests
        shell: pwsh
        run: |
          $fails = 0
          foreach ($i in 1..15) { & ./windows-bin/test_bitcoinoil.exe --run_test=wallet_tests --report_level=no --log_level=nothing; if ($LASTEXITCODE -ne 0) { $fails++; "wallet_tests run $i exit=$LASTEXITCODE" } }
          foreach ($i in 1..10) { & ./windows-bin/test_bitcoinoil.exe --run_test=validation_chainstatemanager_tests --report_level=no --log_level=nothing; if ($LASTEXITCODE -ne 0) { $fails++; "csm run $i exit=$LASTEXITCODE" } }
          foreach ($i in 1..3) { python contrib/auxpow/wallet_upgrade_regtest.py --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/bitcoinoil-qt.exe; if ($LASTEXITCODE -ne 0) { $fails++; "qt wallet run $i exit=$LASTEXITCODE" } }
          foreach ($i in 1..2) { python contrib/auxpow/wallet_upgrade_regtest.py --legacy --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/bitcoinoil-qt.exe; if ($LASTEXITCODE -ne 0) { $fails++; "qt legacy run $i exit=$LASTEXITCODE" } }
          "TOTAL failures=$fails of 30"
          if ($fails -ne 0) { exit 1 }
