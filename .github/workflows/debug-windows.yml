name: Debug Windows wallet upgrade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-dumps:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
          repository: escapeneo/bitcoinoil
          run-id: 41448768863
          github-token: ${{ github.token }}
      - name: Prepare cdb wrappers
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $cmds = 'sxe -c \"r;u @rip L4;k 60;lm m bitcoinoil*;lm m test_*;q\" av; sxe -c \"r;u @rip L4;k 60;lm m bitcoinoil*;lm m test_*;q\" dz; g'
          "@`"$cdb`" -g -G -o -c `"$cmds`" `"%~dp0bitcoinoil-qt.exe`" %*" | Set-Content -Encoding ascii windows-bin/qt-cdb.cmd
          Get-Content windows-bin/qt-cdb.cmd
      - name: Unit tests under cdb
        continue-on-error: true
        shell: pwsh
        run: |
          python contrib/auxpow/fetch_test_assets.py "$env:RUNNER_TEMP/assets"
          $env:DIR_UNIT_TEST_DATA = "$env:RUNNER_TEMP/assets"
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          foreach ($i in 1..3) {
            & $cdb -g -G -o -c 'sxe -c "r;u @rip L4;k 60;lm m test_*;q" dz; sxe -c "r;u @rip L4;k 60;lm m test_*;q" av; g' ./windows-bin/test_bitcoinoil.exe --log_level=warning --report_level=short 2>&1 | Select-String -Pattern 'ModLoad|^\s*$' -NotMatch | Select-Object -Last 80
            "unit exit=$LASTEXITCODE"
          }
      - name: Wallet upgrade into Qt under cdb
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($i in 1..2) {
            $d = "$env:RUNNER_TEMP/w$i"
            python contrib/auxpow/wallet_upgrade_regtest.py --tmpdir="C:/Users/runneradmin/AppData/Local/Temp/w$i" --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/qt-cdb.cmd
            "wallet exit=$LASTEXITCODE"
            Get-Content "C:/Users/runneradmin/AppData/Local/Temp/w$i/node/process.log" | Select-String -Pattern 'ModLoad|^\s*$' -NotMatch | Select-Object -Last 90
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dumps-${{ matrix.attempt }}
          path: C:/Users/runneradmin/AppData/Local/Temp/w*/node/process.log
