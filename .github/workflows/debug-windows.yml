name: Debug Windows wallet upgrade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-dumps:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
          repository: escapeneo/bitcoinoil
          run-id: 41448768863
          github-token: ${{ github.token }}
      - name: Repeat suspect suites
        continue-on-error: true
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          New-Item -ItemType Directory -Force C:/unitlogs | Out-Null
          foreach ($suite in 'wallet_tests','validation_chainstatemanager_tests') {
            $fails = 0
            foreach ($i in 1..15) { & ./windows-bin/test_bitcoinoil.exe --run_test=$suite --report_level=no --log_level=nothing; if ($LASTEXITCODE -ne 0) { $fails++; "plain $suite run $i exit=$LASTEXITCODE" } }
            "plain $suite failures=$fails/15"
            foreach ($i in 1..15) {
              $out = & $cdb -g -G -o -c 'sxe -c "r;u @rip L6;k 60;~*k 30;lm m test_*;q" dz; sxe -c "r;u @rip L6;k 60;lm m test_*;q" av; g' ./windows-bin/test_bitcoinoil.exe --run_test=$suite --report_level=no --log_level=nothing 2>&1
              if ($out -match 'divide|Access violation') { "cdb $suite run $i caught:"; $out | Select-String -Pattern 'ModLoad|NatVis|^\s*$|Unknown exception' -NotMatch | Select-Object -Last 150; break }
            }
            "cdb $suite done"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dumps-${{ matrix.attempt }}
          path: C:/unitlogs
