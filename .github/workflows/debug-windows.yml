name: Debug Windows wallet upgrade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-wallet:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
          repository: escapeneo/bitcoinoil
          run-id: 41448768863
          github-token: ${{ github.token }}
      - name: Install gdb
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-gdb | Select-Object -Last 3
          '@"C:\msys64\mingw64\bin\gdb.exe" -batch -ex "set pagination off" -ex "handle SIGSEGV stop" -ex run -ex "bt 60" -ex "thread apply all bt 25" --args "%~dp0bitcoinoil-qt.exe" %*' | Set-Content -Encoding ascii windows-bin/qt-gdb.cmd
      - name: A Qt in default temp under gdb
        continue-on-error: true
        shell: pwsh
        run: |
          python contrib/auxpow/wallet_upgrade_regtest.py --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/qt-gdb.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/w" | Out-Null
          Get-ChildItem $env:TEMP -Directory -Filter 'btco-wallet-upgrade-*' | ForEach-Object { Copy-Item -Recurse $_.FullName "$env:RUNNER_TEMP/w/" }
          if (Test-Path C:/btcotest) { Copy-Item -Recurse C:/btcotest "$env:RUNNER_TEMP/w/" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wallet-logs-${{ matrix.attempt }}
          path: ${{ runner.temp }}/w
