name: Debug Windows wallet upgrade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-steps:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
        source:
          - {repo: escapeneo/bitcoinoil, run: 41448768863}
          - {repo: Pan0ramix/bitcoinoil, run: 41513744648}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
          repository: ${{ matrix.source.repo }}
          run-id: ${{ matrix.source.run }}
          github-token: ${{ github.token }}
      - name: Checksums
        shell: pwsh
        run: Get-FileHash windows-bin/*.exe | Format-Table Hash,Path -AutoSize
      - name: Assets
        continue-on-error: true
        shell: pwsh
        run: |
          python contrib/auxpow/fetch_test_assets.py "$env:RUNNER_TEMP/assets"
          "fetch exit=$LASTEXITCODE"
          Get-ChildItem "$env:RUNNER_TEMP/assets"
      - name: Unit tests
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DIR_UNIT_TEST_DATA = "$env:RUNNER_TEMP/assets"
          & ./windows-bin/test_bitcoinoil.exe --log_level=warning --report_level=short
          "unit exit=$LASTEXITCODE"
      - name: Qt tests
        continue-on-error: true
        shell: pwsh
        run: |
          & ./windows-bin/test_bitcoinoil-qt.exe
          "qt exit=$LASTEXITCODE"
      - name: Wallet upgrade into Qt (default temp)
        continue-on-error: true
        shell: pwsh
        run: |
          python contrib/auxpow/wallet_upgrade_regtest.py --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/bitcoinoil-qt.exe
          "wallet exit=$LASTEXITCODE"
          python contrib/auxpow/wallet_upgrade_regtest.py --legacy --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/bitcoinoil-qt.exe
          "legacy exit=$LASTEXITCODE"
