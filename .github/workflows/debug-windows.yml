name: Debug Windows wallet upgrade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-steps:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: btco/fix-qt-sendcoins-crash
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
          repository: Pan0ramix/bitcoinoil
          run-id: 41513744648
          github-token: ${{ github.token }}
      - name: Assets
        continue-on-error: true
        shell: pwsh
        run: |
          python contrib/auxpow/fetch_test_assets.py "$env:RUNNER_TEMP/assets"
          "fetch exit=$LASTEXITCODE"
          Get-ChildItem "$env:RUNNER_TEMP/assets"
      - name: Unit tests
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DIR_UNIT_TEST_DATA = "$env:RUNNER_TEMP/assets"
          & ./windows-bin/test_bitcoinoil.exe --log_level=warning --report_level=short 2>&1 | Select-Object -Last 40
          "unit exit=$LASTEXITCODE"
      - name: Qt tests
        continue-on-error: true
        shell: pwsh
        run: |
          & ./windows-bin/test_bitcoinoil-qt.exe 2>&1 | Select-Object -Last 40
          "qt exit=$LASTEXITCODE"
      - name: Wallet upgrade into Qt (default temp)
        continue-on-error: true
        shell: pwsh
        run: |
          python contrib/auxpow/wallet_upgrade_regtest.py --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/bitcoinoil-qt.exe
          "wallet exit=$LASTEXITCODE"
          python contrib/auxpow/wallet_upgrade_regtest.py --legacy --old-binary=windows-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/bitcoinoil-qt.exe
          "legacy exit=$LASTEXITCODE"
