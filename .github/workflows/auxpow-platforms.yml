name: AuxPoW platform builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install cross compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config python3 curl bsdextrautils cmake g++-mingw-w64-x86-64-posix bison patch xz-utils zip
      - name: Build pinned dependencies and Windows binaries
        run: |
          make -C depends HOST=x86_64-w64-mingw32 -j3
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-w64-mingw32/share/config.site" ./configure --prefix="$PWD/depends/x86_64-w64-mingw32" --disable-bench --disable-fuzz-binary
          make -C src -j3 bitcoinoild.exe bitcoinoil-cli.exe qt/bitcoinoil-qt.exe test/test_bitcoinoil.exe qt/test/test_bitcoinoil-qt.exe
          mkdir windows-bin
          cp src/bitcoinoild.exe src/bitcoinoil-cli.exe src/qt/bitcoinoil-qt.exe src/test/test_bitcoinoil.exe src/qt/test/test_bitcoinoil-qt.exe windows-bin/
          export BTCO_DEPENDS="$PWD/depends/x86_64-w64-mingw32"
          export BTCO_ARTIFACTS="$PWD/windows-bin"
          mkdir /tmp/btco-old-windows
          exit 0
          git archive 9e491b31013bb379302d28e57803916147537a2c | tar -x -C /tmp/btco-old-windows
          (
            cd /tmp/btco-old-windows
            ./autogen.sh
            CONFIG_SITE="$BTCO_DEPENDS/share/config.site" ./configure --prefix="$BTCO_DEPENDS" --without-gui --disable-bench --disable-fuzz-binary
            make -C src -j3 bitcoinoild.exe
            cp src/bitcoinoild.exe "$BTCO_ARTIFACTS/bitcoinoild-25.1.1.exe"
          )
          cd windows-bin
          sha256sum *.exe > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: windows-bin
          path: windows-bin/
  windows-test:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin
      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: old-bin
          repository: escapeneo/bitcoinoil
          run-id: 41448768863
          github-token: ${{ github.token }}
      - name: wallet_tests with crash tracer
        continue-on-error: true
        shell: pwsh
        run: |
          $env:BTCO_CRASH_LOG = "$env:RUNNER_TEMP/unit-crash.log"
          foreach ($i in 1..12) { & ./windows-bin/test_bitcoinoil.exe --run_test=wallet_tests --report_level=no --log_level=nothing --catch_system_errors=no; "unit run $i exit=$LASTEXITCODE" }
          foreach ($i in 1..6) { & ./windows-bin/test_bitcoinoil.exe --run_test=validation_chainstatemanager_tests --report_level=no --log_level=nothing --catch_system_errors=no; "csm run $i exit=$LASTEXITCODE" }
          if (Test-Path $env:BTCO_CRASH_LOG) { Get-Content $env:BTCO_CRASH_LOG }
      - name: Qt wallet upgrade with crash tracer
        continue-on-error: true
        shell: pwsh
        run: |
          $env:BTCO_CRASH_LOG = "$env:RUNNER_TEMP/qt-crash.log"
          foreach ($i in 1..3) { python contrib/auxpow/wallet_upgrade_regtest.py --old-binary=old-bin/bitcoinoild-25.1.1.exe --binary=windows-bin/bitcoinoil-qt.exe; "wallet run $i exit=$LASTEXITCODE" }
          if (Test-Path $env:BTCO_CRASH_LOG) { Get-Content $env:BTCO_CRASH_LOG }
